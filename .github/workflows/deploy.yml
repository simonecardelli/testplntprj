name: Deploy On-Premise Transazionale

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Codice
        uses: actions/checkout@v7

      - name: Packaging dell'Artefatto
        run: tar -czf /tmp/release.tar.gz --exclude='.git' .
      
      - name: Trasferimento ed Esecuzione Deploy Atomico via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          script: |
            TAG=${GITHUB_REF#refs/tags/}
            RELEASE_DIR="/var/www/releases/$TAG"
            echo "Trasferimento ed Esecuzione Deploy Atomico via SSH: $TAG $RELEASE_DIR" 
      
      - name: Rollback Automatico in caso di errore
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "⚠️ Deploy fallito! Ripristino versione precedente..."